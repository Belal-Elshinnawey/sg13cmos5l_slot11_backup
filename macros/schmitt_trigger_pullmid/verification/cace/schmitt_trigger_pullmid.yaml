        xaxis: v_plus_arr
      v_minus_mm:
        type: histogram
        xaxis: v_minus_arr
      hysteresis_mm:
        type: histogram
        xaxis: hysteresis_arr
    conditions:
      dvdd:
        typical: 1.2
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        typical: 27

