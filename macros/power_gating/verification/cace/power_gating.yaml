#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           power_gating
description:    ENA/STDBY power-gating macro for the ihp-sg13cmos5l Chipalooza slot_3 design (sg13cmos5l_ht_ip__hsxo_cpz2); gates AVDD/DVDD/IBIAS into EG_AVDD/SG_AVDD/SG_DVDD/EG_IBIAS for vittoz_pierce_osc and schmitt_trigger_pullmid, via two internal level_shifter instances
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Chipalooza slot_3 team
  company:          N/A
  creation_date:    October 28, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  AVDD:
    description: Analog supply to be gated
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  DVDD:
    description: Digital supply to be gated, and ENA/STDBY's own logic domain
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.32
  GND:
    description: Simulation reference, tied to the DUT's VSS pin
    type: ground
    direction: inout
  IBIAS:
    description: Reference bias current to be mirrored into EG_IBIAS
    type: signal
    direction: input
  ENA:
    description: Enable control (DVDD-domain digital)
    type: signal
    direction: input
  STDBY:
    description: Standby control (DVDD-domain digital); this template holds ENA/STDBY=1/0 for 0-30us (on), then 0/1 for 30-60us (standby)
    type: signal
    direction: input
  EG_AVDD:
    description: Gated AVDD output to vittoz_pierce_osc
    type: power
    direction: inout

default_conditions:
  vdd:
    description: Analog supply voltage
    display: AVDD
    unit: V
    typical: 3.3
  dvdd:
    description: Digital supply voltage
    display: DVDD
    unit: V
    typical: 1.2
  ibias:
    description: Reference bias current
    display: IBIAS
    unit: A
    typical: 1e-6
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  tran_params:
    spec:
      eg_avdd_on:
        display: Settled EG_AVDD voltage while enabled (ENA=1, STDBY=0)
        unit: V
        minimum:
          value: 2.9
        typical:
          value: 3.3
        maximum:
          value: any
      i_ibias_on:
        display: Mirrored EG_IBIAS current while enabled
        unit: A
        minimum:
          value: any
        typical:
          value: 0.000001
        maximum:
          value: any
      i_inrush_pk_avdd:
        display: Peak AVDD inrush current at power-up
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.001
      i_inrush_pk_dvdd:
        display: Peak DVDD inrush current at power-up
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.001
      i_inrush_pk_total:
        display: Peak total (AVDD+DVDD) inrush current at power-up
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.002
      eg_avdd_off:
        display: Settled EG_AVDD voltage in standby (ENA=0, STDBY=1)
        unit: V
        minimum:
          value: any
        typical:
          value: 0
        maximum:
          value: 0.1
      i_leak_stdby_avdd:
        display: AVDD leakage current in standby
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0000001
      i_leak_stdby_dvdd:
        display: DVDD leakage current in standby
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0000001
      i_leak_stdby_total:
        display: Total (AVDD+DVDD) leakage current in standby
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0000002
    tool:
      ngspice:
        template: power_gating_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [i_inrush_pk_avdd, i_inrush_pk_dvdd, i_inrush_pk_total, eg_avdd_on, i_ibias_on, eg_avdd_off, i_leak_stdby_avdd, i_leak_stdby_dvdd, i_leak_stdby_total]
    plot:
      eg_avdd_on_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: eg_avdd_on
        limits: auto
      eg_avdd_on_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: eg_avdd_on
        limits: auto
      i_ibias_on_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: i_ibias_on
        limits: auto
      i_inrush_pk_total_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: i_inrush_pk_total
        limits: auto
      i_leak_stdby_total_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: i_leak_stdby_total
        limits: auto
    conditions:
      vdd:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      dvdd:
        typical: 1.2
      ibias:
        typical: 1e-6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 85

