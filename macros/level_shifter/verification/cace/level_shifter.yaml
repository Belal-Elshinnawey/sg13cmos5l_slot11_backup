#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           level_shifter
description:    DVDD(1.2V)-to-AVDD(3.3V) digital level-shifter macro for the ihp-sg13cmos5l Chipalooza slot_3 design (sg13cmos5l_ht_ip__hsxo_cpz2), used twice inside power_gating
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Chipalooza slot_3 team
  company:          N/A
  creation_date:    October 28, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  AVDD:
    description: High-side (shifted-to) supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  DVDD:
    description: Low-side (input-domain) supply
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.32
  GND:
    description: Simulation reference, tied to the DUT's VSS pin
    type: ground
    direction: inout
  LO:
    description: DVDD-domain digital input
    type: signal
    direction: input
  HI:
    description: AVDD-domain digital output (shifted LO)
    type: signal
    direction: output
  HI_B:
    description: AVDD-domain digital output (shifted, inverted LO)
    type: signal
    direction: output
  LO_B:
    description: DVDD-domain digital output (inverted LO)
    type: signal
    direction: output

default_conditions:
  vdd:
    description: High-side supply voltage
    display: AVDD
    unit: V
    typical: 3.3
  dvdd:
    description: Low-side supply voltage
    display: DVDD
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  tran_params:
    spec:
      tpd_rise:
        display: Rising propagation delay (LO to HI)
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000012
      tpd_fall:
        display: Falling propagation delay (LO to HI)
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.00002
      tr_hi:
        display: HI rise time (10-90%)
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000000001
      tf_hi:
        display: HI fall time (90-10%)
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000000015
    tool:
      ngspice:
        template: level_shifter_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [tpd_rise, tpd_fall, tr_hi, tf_hi]
    plot:
      tpd_rise_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: tpd_rise
        limits: auto
      tpd_rise_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: tpd_rise
        limits: auto
      tpd_fall_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: tpd_fall
        limits: auto
      tpd_fall_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: tpd_fall
        limits: auto
      tpd_rise_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: tpd_rise
        limits: auto
      tpd_fall_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: tpd_fall
        limits: auto
    conditions:
      vdd:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      dvdd:
        typical: 1.2
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 85

  tran_mc_params:
    spec:
      tpd_rise:
        display: Rising propagation delay - Monte Carlo
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000012
      tpd_fall:
        display: Falling propagation delay - Monte Carlo
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.00002
      tr_hi:
        display: HI rise time - Monte Carlo
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000000001
      tf_hi:
        display: HI fall time - Monte Carlo
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.000000015
    tool:
      ngspice:
        template: level_shifter_tb_tran.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [tpd_rise, tpd_fall, tr_hi, tf_hi]
        script: level_shifter_tb_tran.py
        script_variables: [tpd_rise_arr, tpd_fall_arr, tr_hi_arr, tf_hi_arr]
    plot:
      tpd_rise_mc:
        type: histogram
        xaxis: tpd_rise_arr
      tpd_fall_mc:
        type: histogram
        xaxis: tpd_fall_arr
    conditions:
      vdd:
        typical: 3.3
      dvdd:
        typical: 1.2
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_stat
      corner_r:
        typical: stat
      temp:
        typical: 27

  tran_mm_params:
